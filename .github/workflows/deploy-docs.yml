# Deploy docs/build (adapter-static, base-aware source) to GitHub Pages.
# No CNAME here: custom domain undecided; project-pages subpath is the
# default via DOCS_BASE_PATH below.
name: deploy-docs

on:
  push:
    branches: [master]
    paths: ["docs/**", "src/**", ".github/workflows/deploy-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # docs/uno.config.ts imports the preset via ../src (TS), and src/
      # runtime-imports the `unocss` peer — so root node_modules must exist
      # too (resolution walks up from src/).
      - run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run build
        # $env/static/public only exports vars present at build time;
        # locally this comes from gitignored docs/.env (see .env.example).
        # Base-path source fix (kit.paths.base + mdsvex base-links +
        # $app/paths); custom domain: set DOCS_BASE_PATH="" +
        # DOCS_SITE_URL=https://<domain>.
        env:
          PUBLIC_DAISYUI_API_PATH: https://api.daisyui.com
          DOCS_SITE_URL: https://itsmeeudrino.github.io
          DOCS_BASE_PATH: /unocss-preset-daisy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
