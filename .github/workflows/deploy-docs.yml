# Deploy docs/build (adapter-static, root-domain only — no paths.base)
# to GitHub Pages. No CNAME here: custom domain undecided; without one the
# project-pages subpath URL WILL break (absolute / links + trailingSlash).
name: deploy-docs

on:
  push:
    branches: [master]
    paths: ["docs/**", "src/**", ".github/workflows/deploy-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      # docs/uno.config.ts imports the preset via ../src (TS), and src/
      # runtime-imports the `unocss` peer — so root node_modules must exist
      # too (resolution walks up from src/).
      - run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
